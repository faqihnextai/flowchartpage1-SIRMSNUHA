<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alur Proses Registrasi & Asesmen Medis/Perawat</title>
    <!--Tailwind CSS-->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- html2pdf.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/global.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <i data-lucide="activity" class="w-7 h-7 text-teal-400"></i>
                <h1 class="text-xl font-bold tracking-wide">Flowchart Alur Pelayanan Medis</h1>
            </div>
            
            <nav class="flex items-center gap-2 text-sm font-medium">
                <button onclick="switchCategory('registrasi')" id="btn-registrasi" class="px-4 py-2 rounded-lg transition-all bg-teal-600 text-white shadow-lg">
                    Registrasi
                </button>
                <button onclick="switchCategory('perawat')" id="btn-perawat" class="px-4 py-2 rounded-lg transition-all hover:bg-slate-700 text-slate-300">
                    Asesmen Perawat
                </button>
                <button onclick="switchCategory('medis')" id="btn-medis" class="px-4 py-2 rounded-lg transition-all hover:bg-slate-700 text-slate-300">
                    Asesmen Medis
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <!-- Sidebar Navigation (Layanan) -->
        <aside class="bg-slate-800 rounded-xl p-4 border border-slate-700/60 shadow-md h-fit">
            <h2 id="category-title" class="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-3">
                Menu Registrasi
            </h2>
            <ul id="menu-list" class="space-y-2">
                <!-- Dynamic Menu Loaded via JS -->
            </ul>
        </aside>

        <!-- Viewer Canvas / Frame Area -->
        <section class="md:col-span-3 bg-slate-800 rounded-xl border border-slate-700/60 shadow-md flex flex-col overflow-hidden min-h-[500px]">
            <!-- Frame Header -->
            <div class="bg-slate-800/80 border-b border-slate-700 px-5 py-3 flex items-center justify-between">
                <div class="flex items-center gap-2 text-slate-300">
                    <i data-lucide="workflow" class="w-4 h-4 text-teal-400"></i>
                    <span id="current-view-title" class="font-medium text-sm">Pilih alur proses untuk menampilkan diagram</span>
                </div>
                <div class="flex items-center gap-2 text-xs text-slate-400">
                    <span id="current-path" class="bg-slate-900/60 px-2.5 py-1 rounded border border-slate-700 font-mono">/Page/Registrasi/...</span>
                </div>
            </div>

            <!-- Content Iframe -->
            <div class="flex-1 w-full h-full relative bg-slate-950">
                <iframe id="flow-frame" class="w-full h-full border-0 absolute inset-0" title="Flowchart View"></iframe>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 text-center py-3 text-xs text-slate-400">
        &copy; Alur Proses Registrasi dan Asesmen Medis/Perawat
    </footer>

    <!-- Custom Scripts (Relative Paths) -->
     
    <script src="js/extention.js"></script>
    <script src="js/app.js"></script>
    
</body>
</html>
